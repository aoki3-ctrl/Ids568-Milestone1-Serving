name: Milestone 2 CI/CD

on:
  push:
    paths:
      - 'module3/milestone2/**'
  pull_request:
    paths:
      - 'module3/milestone2/**'

jobs:

  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: module3/milestone2

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd app
          pip install -r requirements.txt

      - name: Run tests
        run: pytest


  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: module3/milestone2

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t milestone2-app:${{ github.sha }} .

      - name: Tag image with semantic version
        run: |
          docker tag milestone2-app:${{ github.sha }} milestone2-app:v1.0.0
